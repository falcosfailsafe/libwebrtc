name: Discourse Windows libwebrtc
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discourse-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned source/build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build
          key: windows-webrtc-${{ hashFiles('discourse-build/source.json') }}-${{ github.sha }}
          restore-keys: windows-webrtc-${{ hashFiles('discourse-build/source.json') }}-
      - name: Install Ninja
        run: python -m pip install ninja==1.13.0
      - name: Build pinned WebRTC and run C++ API tests
        shell: pwsh
        run: ./discourse-build/build-windows.ps1
      - name: Save source/build cache even after a compiler error
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build
          key: windows-webrtc-${{ hashFiles('discourse-build/source.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-win-x64-release
          path: |
            libwebrtc-win-x64-release.zip
            libwebrtc-win-x64-release.zip.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: libwebrtc-win-x64-release
          path: artifacts
      - name: Publish immutable build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("discourse-build/source.json"))["release_tag"])')
          # Never overwrite a release or silently replace a binary in place.
          gh release create "$tag" artifacts/* --target "$GITHUB_SHA" \
            --title "$tag" --notes "Windows x64 libwebrtc built from pinned source. See SOURCE.json and WRAPPER_REVISION.txt in the archive. Hardware screen-share acceptance requires a separate Windows/NVIDIA test run."
